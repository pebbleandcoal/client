<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTT Whisper Audio Proofreader</title>
  <style>
    :root {
      --bg: #0c0f17;
      --card-bg: #141926;
      --panel-bg: #1b2234;
      --border: #26324a;
      --text: #e2e8f0;
      --muted: #8e9bb5;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --diff-sub: #f59e0b;
      --diff-del: #ef4444;
      --diff-ins: #10b981;
      --match: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .title-group h1 { font-size: 20px; font-weight: 700; color: #fff; }
    .title-group p { font-size: 13px; color: var(--muted); }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    button, label.btn-file {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      color: var(--text);
      transition: all 0.15s ease;
    }
    button:hover, label.btn-file:hover {
      background: #252f46;
      border-color: #3b4c6e;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #041325;
    }
    button.primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    input[type="file"] { display: none; }

    /* Audio Bar */
    .audio-player-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(20, 25, 38, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    audio { height: 34px; flex-grow: 1; outline: none; }
    .stats-summary {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .stats-summary strong { color: #fff; }

    /* Cue Card */
    .cue-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 16px;
      transition: border-color 0.15s ease;
    }
    .cue-card.has-diff { border-left: 4px solid var(--diff-sub); }
    .cue-card.perfect { border-left: 4px solid var(--match); }
    .cue-card.active-playback { border-color: var(--accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.15); }

    .cue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .cue-timestamp {
      font-family: monospace;
      font-size: 13px;
      color: #cbd5e1;
    }
    .badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-diff { background: rgba(245, 158, 11, 0.15); color: var(--diff-sub); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-ok { background: rgba(16, 185, 129, 0.15); color: var(--match); border: 1px solid rgba(16, 185, 129, 0.3); }

    .cue-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 860px) {
      .cue-body { grid-template-columns: 1fr; }
    }

    .column-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .col-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .original-text-content {
      font-size: 14.5px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* Diff View on Right */
    .diff-display {
      font-size: 14.5px;
      line-height: 1.8;
      min-height: 38px;
    }
    .word-token {
      display: inline-block;
      margin: 2px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #111726;
      border: 1px solid #232d43;
    }
    .word-token.match {
      color: #cbd5e1;
      background: transparent;
      border-color: transparent;
    }
    .word-token.sub {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .word-token.ins {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .btn-word-fix {
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
      padding: 1px 5px;
      font-size: 10px;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-word-fix:hover { background: #b45309; }

    .cue-editor-input {
      width: 100%;
      background: #111624;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      padding: 8px;
      font-size: 13.5px;
      font-family: inherit;
      resize: vertical;
    }
    .cue-editor-input:focus {
      outline: none;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>Whisper VTT Proofreader & Line Corrector</h1>
      <p>Original on left matched per-line from VTT lead. Diffs marked on right.</p>
    </div>
    <div class="top-controls">
      <label class="btn-file">
        Load Original (.txt)
        <input type="file" id="originalFileInput" accept=".txt">
      </label>
      <label class="btn-file">
        Load VTT (.vtt)
        <input type="file" id="vttFileInput" accept=".vtt">
      </label>
      <label class="btn-file">
        Attach Audio
        <input type="file" id="audioFileInput" accept="audio/*">
      </label>
      <button class="primary" id="exportVttBtn">Export Corrected VTT</button>
    </div>
  </header>

  <div class="audio-player-bar">
    <audio id="mainAudio" controls></audio>
    <div class="stats-summary" id="statsBox">
      <span>Cues: <strong id="totalCues">0</strong></span>
      <span>Cues with Diffs: <strong id="diffCues">0</strong></span>
      <span>Word Accuracy: <strong id="accPct">100%</strong></span>
    </div>
  </div>

  <div id="cuesContainer"></div>

  <script>
    // Embedded defaults matching your provided project files
    let originalText = `Rusty opens his eyes. He lies on a folded burlap sack next to an overturned wooden basket in the barn.
He pushes his big white paws against the rough jute fibers and presses his whiskers into a frayed seam. He smells the fabric. He loves the smell.
Pipkin walks in, and says hello to Rusty.
He sees a loose kernel of yellow feed-corn rolls on the floor. He lowers his forehead to the stones. He sniffs the tough corn kernel. He decides not to eat it, it smells old.
Rusty rolls onto his belly and gets up on all fours. His long copper ears slap against his loose neck folds.
He steps onto the cold limestone slabs of the central barn aisle and presses his paws against the smooth gray stone. He feels the cool surface. It is slippery.
He trots to the strong base of the grain scale. He lifts his left back leg to scratch behind his folded ear.
Rusty lowers his heavy nose. He tracks a line of crushed oat-husks along the stone-seam. He walks the dry trail past the wooden harness-pegs.
Pipkin clamps his teeth on a dry wheat straw. He shakes his head twice and drops the broken stalk on the ground.
They go through the big double doors of the barn. Pipkin pauses with his front paws on the raised iron door track.
His upright left ear twitches toward the open farm yard. Down the dirt lane, the wooden chicken run stands quiet next to the cedar posts of the apple packing shed.
Rusty steps over the iron door-track. He walks onto the packed clay-lane. He lowers his head and pushes his whiskers into the red dirt.
He tests the slope and feels the gravel. Pipkin trots down the wooden ramp into the lane. The two puppies walk together to the open lower-fields.
A dry wind blows over the tall fescue grass at the edge of the lower fields. A steady whistling sound comes from a drainage ditch next to the dry stone wall.
The vibration makes a hollow ring inside a hidden metal tube. Rusty stops walking. He lowers his copper snout.
Pipkin darts toward the ditch bank. His tail held high. At the base of the dry stone wall, an angled corrugated iron pipe sits.
The metal cylinder channels water from the pasture when it rains heavily in autumn. Inside the lower opening, they see an old green rubber ball, wedged between two raised corrugation ridges.
The rubber ball has fine surface cracks and has faded green from the summer sun. Pipkin drops low on his front elbows.
He stares directly into the iron pipe. The round ball sits four inches past the metal lip. Pipkin really wants a round green ball.
Rusty walks down the pasture slope. He takes slow, careful steps. His loose neck folds over his broad shoulders.
He lowers his head and puts his front-pads on a flat fieldstone by the ditch. His soft, copper ears touch the wet stems of the chickweed and wild field-clover.
Pipkin snaps his jaws at the empty air above the pipe. He presses his scratchy whiskers against the cold metal edge.
The ball stays still, tightly against a seam where two pipe sections connect. Pipkin snorts once and taps the iron with his front claws.
Rusty pushes his black nose into the gap under the pipe. He checks the angle of the incline. The iron cylinder rises at a steady slope. It goes up toward the edge of the woods.
Pipkin drops his chest flat on the ditch gravel. He pushes his firm, flat forehead right into the opening of the iron pipe.
He shoves with his back paws. He pushes his head into the dark channel. His white whiskers scrape against the flaking metal.
Pipkin strikes the faded green rubber ball with a powerful throw.
But now the ball slides deeper into the metal tube. The rubber fits tightly between two raised ridges inside the iron pipe.
Pipkin digs his feet in the loose ditch gravel. His back paws spray red dirt across Rusty’s white front paws.
Pipkin pulls his head back out of the tube. His scruffy tan face has black soot smudges across his nose. He sneezes two times into the dry grass in the pasture.
Rusty steps forward to look at the opening. He lowers his big nose until his whiskers touch the edge. The ball now sits deeper inside the pipe.
Pipkin barks at the iron mouth. The sharp sound makes a dull metallic clang inside the dark pipe.
He slides his right front paw into the pipe. The iron collar is too narrow for his shoulder.
Rusty blows two sharp puffs of air across the stone base. He clears away loose red dirt.
The green ball sits even deeper inside the pipe than when they first arrived.
Pipkin sits in the weeds. He lifts his left leg to scratch his ribs.
Rusty walks around the drainage pipe. He pushes his nose into the wild clover roots that grow along the stone wall.
The corrugated iron pipe runs toward the tree line. Thick oak trees and wild blackberry brambles stand at the beginning of the woods. A deep ditch goes along the stone wall to the tree line.
The ground rises steadily toward the edge of the forest. Rousty walks up the hill. Pipkin follows and darts past Rusty
Rusty looks at the trail. He places each big paw carefully on the packed red dirt.
They go to the upper ditch seam by the woods. The top of the corrugated iron pipe sits under a thick mess of dry twigs and is open.
Rusty lowers his copper snout to the intake grate. A faint draft of cool air flows from the dark opening.
The green rubber ball sits ten feet down the tube from this side. Pipkin butts the iron bars with his flat forehead, but the metal stays solid and fixed.
Pipkin runs to the willow branch. He bites the small end of the stick. He pulls the branch back with lots of energy.
The stick slides three inches through the oak leaves. Pipkin lets go. He bunts the thicker end with his hard, flat forehead. The branch moves toward the ditch.
Rusty watches the angle of the fallen wood. The thin tip of the willow branch points directly at the center opening of the iron intake grate. If the stick goes into the intake, it pushes the ball down the tube. They guide the tool with precision.
Rusty grips the thick base of the willow branch behind his molars. His broad neck muscles tighten when he lifts the heavy wood off the ground.
He walks backward with small, careful steps. Pipkin trots next to the shaft. Pipkin guides the thin wooden tip with his black nose.
The thin tip of the willow branch goes between two bars of the iron intake grate. Pipkin shoves the wood with his flat forehead. He drives the point two feet into the dark pipe. The bare wood slides on the corrugated iron ridges and makes a dry scraping noise.
Rusty lets go of his bite. He checks the position of the wooden pole. The branch sits flat inside the upper metal chute. The tool sits in place.
Rusty pushes his broad copper chest against the end of the willow branch. Pipkin puts his front paws on the red dirt and leans against the wood. The branch slides down five feet in the dark space. They hear a hollow scrape from inside the pipe.
Sudden physical resistance stops the pole. The branch does not move forward. Six feet inside the tube, a knot on the willow wood catches on a metal seam. The stick jams tight. It does not slide forward, and it does not twist.
Rusty grips the willow base in his mouth. He pulls back to clear the knot that is stuck. His leg slipped on the smooth, wet clay of the ditch bank. His back legs slide out at a funny angle, and he falls onto his tummy in the soft grass.
Pipkin scrambles out of the mud hole. He walks slowly on the leaves and stops next to Rusty’s and sits down in the damp moss. He folds his front paws flat. He tilts his scruffy head to Rusty.
Pipkin leans down and licks Rusty’s muddy jaw clean. Rusty pushes his front paws into a patch of firm gravel beside the stones and pulls his back legs out of the slippery mud.
After a short rest, they go back to the stuck pole. Rusty steps up to the left side of the willow branch. He put his thick snout under the wood and pushes with his whole puppy body toward the pipe.
The wood knot pops free, it makes a dry hollow sound. The willow branch glides smoothly down the inside of the tube and hits the green rubber ball. The ball breaks free from and tumbles down the pipe.
At the bottom of the field, the green rubber ball shoots out of the pipe. It rolls across the open clover pasture and comes to a complete stop. Pipkin runs down the pasture slope after the ball.
Rusty walks at a steady, heavy pace. His long copper ears trail through the clover. The faded green rubber ball sits still in a patch of wild clover.
Rusty arrives next to the clover patch. He touches the curved rubber surface with his nose. He tests its shape and smell.
Feeling happy, they walk side by side up the dirt tractor path. Pipkin is holding the ball in his mouth. They walk past the chicken-run and past the apple-packing shed. Then walk into the open doors of the barn.
Pipkin drops onto his side in a deep hollow of golden oat-straw. He feels like a soft sack of dry beans. Rusty circles two times in the bedding. He packs a round hollow into the stalks. He rests his big, shiny nose on his white front paws.
Pipkin curls his body into a tight circle. He puts his ball in between his paws and his tail over his nose. Rusty's long, velvety copper ears drape flat over the dry oat stalks. His heavy eyelids droop. They shut out the dim barn light.
Outside the open barn doors, the sky above the pasture is deep plum. The dry cedar shingles on the barn roof are rustled by a cool evening breeze. Two puppy tummy rise and fall together in a steady, slow rhythm, softly snoring.`;

00:06:54.260 --> 00:06:58.080
Thick oak trees and wild blackberry brambles

00:06:58.540 --> 00:07:00.320
stand at the beginning of the woods.

00:07:01.380 --> 00:07:05.220
A deep ditch goes along the stone wall to the tree line.

00:07:06.000 --> 00:07:10.540
The ground rises steadily toward the edge of the forest.

00:07:11.500 --> 00:07:12.740
Rusty walks up the hill.

00:07:13.740 --> 00:07:16.320
Pipkin follows and darts past Rusty.

00:07:17.700 --> 00:07:18.940
Rusty looks at the trail.

00:07:19.580 --> 00:07:24.100
He places each big paw carefully on the packed red dirt.

00:07:25.000 --> 00:07:28.740
They go to the upper ditch seam by the woods.

00:07:29.800 --> 00:07:36.280
The top of the corrugated iron pipe sits under a thick mess of dry twigs and is open.

00:07:37.800 --> 00:07:40.840
Rusty lowers his copper snout to the intake grate.

00:07:41.680 --> 00:07:45.380
A faint draft of cool air flows from the dark opening.

00:07:46.200 --> 00:07:51.400
The green rubber ball sits ten feet down the tube from this side.

00:07:52.740 --> 00:07:55.760
Pipkin butts the iron bars with his flat forehead,

00:07:56.350 --> 00:07:58.520
but the metal stays solid and fixed.

00:08:00.320 --> 00:08:02.420
Pipkin runs to the willow branch.

00:08:03.070 --> 00:08:04.900
He bites the small end of the stick.

00:08:05.670 --> 00:08:08.480
He pulls the branch back with lots of energy.

00:08:09.100 --> 00:08:13.020
The stick slides three inches through the oak leaves.

00:08:14.120 --> 00:08:14.880
Pipkin lets go.

00:08:15.570 --> 00:08:18.040
He bunts the thicker end with his hard,

00:08:18.300 --> 00:08:19.060
flat forehead.

00:08:19.720 --> 00:08:21.860
The branch moves toward the ditch.

00:08:23.060 --> 00:08:25.820
Rusty watches the angle of the fallen wood.

00:08:26.440 --> 00:08:29.880
The thin tip of the willow branch points directly

00:08:30.140 --> 00:08:33.240
at the center opening of the iron intake grate.

00:08:33.700 --> 00:08:36.140
If the stick goes into the intake,

00:08:36.550 --> 00:08:38.660
it pushes the ball down the tube.

00:08:39.360 --> 00:08:41.760
They guide the tool with precision.

00:08:42.480 --> 00:08:46.520
Rusty grips the thick base of the willow branch

00:08:46.880 --> 00:08:48.240
behind his molars.

00:08:49.260 --> 00:08:51.640
His broad neck muscles tighten

00:08:51.830 --> 00:08:55.220
when he lifts the heavy wood off the ground.

00:08:56.300 --> 00:08:59.240
He walks backward with small,

00:08:59.860 --> 00:09:00.680
careful steps.

00:09:00.800 --> 00:09:03.820
Pipkin trots next to the shaft.

00:09:04.800 --> 00:09:09.100
Pipkin guides the thin wooden tip with his black nose.

00:09:10.500 --> 00:09:16.519
The thin tip of the willow branch goes between two bars of the iron intake grate.

00:09:17.820 --> 00:09:20.660
Pipkin shoves the wood with his flat forehead.

00:09:21.420 --> 00:09:24.779
He drives the point two feet into the dark pipe.

00:09:25.600 --> 00:09:29.800
The bare wood slides on the corrugated iron ridges

00:09:30.160 --> 00:09:31.279
and makes a dry,

00:09:31.620 --> 00:09:32.519
scraping noise.

00:09:34.060 --> 00:09:35.779
Rusty lets go of his bite.

00:09:36.560 --> 00:09:38.800
He checks the position of the wooden pole.

00:09:39.800 --> 00:09:42.819
The branch sits flat inside the upper metal chute.

00:09:43.740 --> 00:09:45.480
The tool sits in place.

00:09:46.000 --> 00:09:51.400
Rusty pushes his broad copper chest against the end of the willow branch.

00:09:52.480 --> 00:09:56.920
Pipkin puts his front paws on the red dirt and leans against the wood.

00:09:58.000 --> 00:10:01.840
The branch slides down five feet in the dark space.

00:10:02.720 --> 00:10:05.840
They hear a hollow scrape from inside the pipe.

00:10:06.500 --> 00:10:10.100
Sudden physical resistance stops the pole.

00:10:11.000 --> 00:10:12.980
The branch does not move forward.

00:10:14.040 --> 00:10:15.560
Six feet inside the tube,

00:10:15.740 --> 00:10:19.180
a knot on the willow wood catches on a metal seam.

00:10:20.160 --> 00:10:21.540
The stick jams tight.

00:10:22.160 --> 00:10:23.740
It does not slide forward,

00:10:24.120 --> 00:10:25.540
and it does not twist.

00:10:26.100 --> 00:10:29.180
Rusty grips the willow base in his mouth.

00:10:29.860 --> 00:10:32.199
He pulls back to clear the knot that is stuck.

00:10:33.139 --> 00:10:36.339
His legs slipped on the smooth wet clay of the ditch bank.

00:10:37.100 --> 00:10:39.600
His back legs slide out at a funny angle,

00:10:39.990 --> 00:10:43.079
and he falls onto his tummy in the soft grass.

00:10:44.160 --> 00:10:46.240
Pipkin scrambles out of the mud hole.

00:10:46.780 --> 00:10:49.320
He walks slowly on the leaves and stops

00:10:49.400 --> 00:10:52.420
next to Rusty's and sits down in the damp moss.

00:10:53.280 --> 00:10:55.360
He folds his front paws flat.

00:10:55.960 --> 00:10:58.380
He tilts his scruffy head to Rusty.

00:11:00.080 --> 00:11:02.480
Pipkin leans down and licks Rusty's

00:11:02.660 --> 00:11:03.620
muddy jaw clean.

00:11:04.200 --> 00:11:10.200
Rusty pushes his front paws into a patch of firm gravel beside the stones and

00:11:10.240 --> 00:11:12.820
pulls his back legs out of the slippery mud.

00:11:14.320 --> 00:11:15.220
After a short rest,

00:11:15.670 --> 00:11:16.620
they go back to

00:11:16.700 --> 00:11:17.500
the stuck pole.

00:11:18.680 --> 00:11:21.300
Rusty steps up to the left side of the willow branch.

00:11:21.890 --> 00:11:22.340
He puts

00:11:22.380 --> 00:11:27.280
his thick snout under the wood and pushes with his whole puppy body toward

00:11:27.380 --> 00:11:27.780
the pipe.

00:11:28.400 --> 00:11:32.080
The wood knot pops free.

00:11:32.930 --> 00:11:34.740
It makes a dry,

00:11:35.220 --> 00:11:36.000
hollow sound.

00:11:36.980 --> 00:11:42.320
The willow branch glides smoothly down the inside of the tube

00:11:42.730 --> 00:11:45.440
and hits the green rubber ball.

00:11:46.370 --> 00:11:50.740
The ball breaks free and tumbles down the pipe.

00:11:51.400 --> 00:11:53.660
At the bottom of the field,

00:11:54.190 --> 00:11:57.520
the green rubber ball shoots out of the pipe.

00:11:58.250 --> 00:12:05.240
It rolls across the open clover pasture and comes to a complete stop.

00:12:06.420 --> 00:12:10.360
Pipkin runs down the pasture slope after the ball.

00:12:11.200 --> 00:12:14.400
Rusty walks at a steady,

00:12:14.980 --> 00:12:15.760
heavy pace.

00:12:16.820 --> 00:12:20.440
His long copper ears trail through the clover.

00:12:21.380 --> 00:12:27.280
The faded green rubber ball sits still in a patch of wild clover.

00:12:27.900 --> 00:12:31.460
Rusty arrives next to the clover patch.

00:12:32.140 --> 00:12:35.700
He touches the curved rubber surface with his nose.

00:12:36.300 --> 00:12:39.240
He tests its shape and smell.

00:12:40.720 --> 00:12:41.560
Feeling happy,

00:12:41.940 --> 00:12:45.660
they walk side by side up the dirt tractor path.

00:12:45.900 --> 00:12:48.820
Pipkin is holding the ball in his mouth.

00:12:49.500 --> 00:12:51.520
They walk past the chicken run

00:12:51.860 --> 00:12:54.080
and past the apple-packing shed,

00:12:54.920 --> 00:12:58.180
then walk into the open doors of the barn.

00:12:59.720 --> 00:13:01.900
Pipkin drops onto his side

00:13:01.900 --> 00:13:04.720
in a deep hollow of golden oatstraw.

00:13:04.900 --> 00:13:09.160
He feels like a soft sack of dry beans.

00:13:10.160 --> 00:13:12.940
Rusty circles two times in the bedding.

00:13:13.550 --> 00:13:16.540
He packs a round hollow into the stalks.

00:13:17.050 --> 00:13:21.820
He rests his big shiny nose on his white front paws.

00:13:22.400 --> 00:13:26.660
Pipkin curls his body into a tight circle.

00:13:27.220 --> 00:13:32.200
He puts his ball in between his paws and his tail over his nose.

00:13:33.320 --> 00:13:34.420
Rusty's long,

00:13:34.740 --> 00:13:39.160
velvety copper ears drape flat over the dry oat stalks.

00:13:40.080 --> 00:13:41.640
His heavy eyelids droop.

00:13:42.100 --> 00:13:44.600
They shut out the dim barn light.

00:13:45.100 --> 00:13:47.959
Outside the open barn doors,

00:13:48.250 --> 00:13:51.540
the sky above the pasture is deep plum.

00:13:52.290 --> 00:13:58.199
The dry cedar shingles on the barn roof are rustled by a cool evening breeze.

00:13:59.319 --> 00:14:03.940
Two puppy tummies rise and fall together in a steady,

00:14:04.660 --> 00:14:05.399
slow rhythm,

00:14:06.560 --> 00:14:07.899
softly snoring.`;

    let cues = [];
    let audioBlobUrl = null;

    function cleanWord(w) {
      return (w || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function parseVTT(text) {
      const lines = text.replace(/\r/g, '').split('\n');
      const list = [];
      let currentCue = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line === 'WEBVTT') continue;

        if (line.includes('-->')) {
          const parts = line.split('-->');
          currentCue = {
            id: list.length + 1,
            start: parts[0].trim(),
            end: parts[1].trim(),
            textLines: []
          };
          list.push(currentCue);
        } else if (currentCue) {
          if (!/^\d+$/.test(line)) { // skip integer IDs
            currentCue.textLines.push(line);
          }
        }
      }

      list.forEach(c => {
        c.text = c.textLines.join(' ');
      });
      return list;
    }

    function timestampToSec(ts) {
      const parts = ts.split(':');
      let h = 0, m = 0, s = 0;
      if (parts.length === 3) {
        h = parseFloat(parts[0]);
        m = parseFloat(parts[1]);
        s = parseFloat(parts[2]);
      } else if (parts.length === 2) {
        m = parseFloat(parts[0]);
        s = parseFloat(parts[1]);
      }
      return h * 3600 + m * 60 + s;
    }

    // Split text into coherent clauses and sentences
    function splitReferencePhrases(text) {
      // Split on periods, exclamation marks, question marks, commas, and line breaks
      const raw = text.split(/(?<=[.,!?;:\n])\s+/);
      const phrases = [];
      raw.forEach(r => {
        const t = r.trim();
        if (t.length > 0) phrases.push(t);
      });
      return phrases;
    }

    // Match each VTT cue to the exact corresponding line in the original text
    function alignCuesToOriginal(cueList, refText) {
      // Clean word array of full manuscript with indices
      const refWords = refText.split(/\s+/).filter(w => w.length > 0);
      let searchCursor = 0;

      cueList.forEach(cue => {
        const cueTokens = cue.text.split(/\s+/).filter(w => w.length > 0);
        const cueClean = cueTokens.map(cleanWord).filter(w => w.length > 0);

        if (cueClean.length === 0) {
          cue.matchedOriginal = "";
          return;
        }

        // Sliding window search starting near searchCursor
        let bestScore = -1;
        let bestStart = searchCursor;
        let bestLen = cueClean.length;

        const maxLookAhead = 80; // look ahead up to 80 words
        const endSearch = Math.min(refWords.length, searchCursor + maxLookAhead);
        const startSearch = Math.max(0, searchCursor - 10);

        for (let s = startSearch; s < endSearch; s++) {
          // vary candidate window size around cueClean length
          for (let len = Math.max(1, cueClean.length - 3); len <= cueClean.length + 4; len++) {
            if (s + len > refWords.length) break;
            const window = refWords.slice(s, s + len).map(cleanWord);
            
            // calculate match score
            let matches = 0;
            for (let i = 0; i < Math.min(cueClean.length, window.length); i++) {
              if (cueClean[i] === window[i]) matches += 2;
              else if (window.includes(cueClean[i])) matches += 1;
            }
            const penalty = Math.abs(window.length - cueClean.length);
            const score = matches - penalty;

            if (score > bestScore) {
              bestScore = score;
              bestStart = s;
              bestLen = len;
            }
          }
        }

        // Extract the exact matching slice from reference
        const matchedSlice = refWords.slice(bestStart, bestStart + bestLen);
        cue.matchedOriginal = matchedSlice.join(' ');
        searchCursor = bestStart + bestLen; // advance cursor forward linearly
      });
    }

    // Word diff comparison between matched line and VTT line
    function computeWordDiff(origStr, vttStr) {
      const origWords = origStr.split(/\s+/).filter(w => w.length > 0);
      const vttWords = vttStr.split(/\s+/).filter(w => w.length > 0);

      const diffTokens = [];
      let hasDifference = false;

      const maxLen = Math.max(origWords.length, vttWords.length);
      for (let i = 0; i < vttWords.length; i++) {
        const vWord = vttWords[i];
        const oWord = origWords[i];

        const cleanV = cleanWord(vWord);
        const cleanO = cleanWord(oWord);

        if (cleanV === cleanO && cleanV !== '') {
          diffTokens.push({ type: 'match', text: vWord });
        } else if (!oWord) {
          diffTokens.push({ type: 'ins', text: vWord });
          hasDifference = true;
        } else {
          diffTokens.push({
            type: 'sub',
            transcribed: vWord,
            original: oWord
          });
          hasDifference = true;
        }
      }

      if (origWords.length > vttWords.length) {
        hasDifference = true;
      }

      return { diffTokens, hasDifference, origWords };
    }

    function renderCues() {
      const container = document.getElementById('cuesContainer');
      container.innerHTML = '';

      let totalWords = 0;
      let matchedWords = 0;
      let diffCueCount = 0;

      cues.forEach(cue => {
        const { diffTokens, hasDifference, origWords } = computeWordDiff(cue.matchedOriginal, cue.text);

        totalWords += origWords.length;
        diffTokens.forEach(t => {
          if (t.type === 'match') matchedWords++;
        });

        if (hasDifference) diffCueCount++;

        const card = document.createElement('div');
        card.className = `cue-card ${hasDifference ? 'has-diff' : 'perfect'}`;
        card.id = `cue-${cue.id}`;

        const diffHtml = diffTokens.map(tok => {
          if (tok.type === 'match') {
            return `<span class="word-token match">${escapeHtml(tok.text)}</span>`;
          } else if (tok.type === 'ins') {
            return `<span class="word-token ins" title="Extra word in transcription">${escapeHtml(tok.text)}</span>`;
          } else {
            return `<span class="word-token sub" title="Original was: ${escapeHtml(tok.original)}">
              ${escapeHtml(tok.transcribed)} 
              <button class="btn-word-fix" onclick="fixWord(${cue.id}, '${escapeQuote(tok.transcribed)}', '${escapeQuote(tok.original)}')">➔ ${escapeHtml(tok.original)}</button>
            </span>`;
          }
        }).join(' ');

        card.innerHTML = `
          <div class="cue-header">
            <div>
              <strong>#${cue.id}</strong> 
              <span class="cue-timestamp">${cue.start} ➔ ${cue.end}</span>
              <span class="badge ${hasDifference ? 'badge-diff' : 'badge-ok'}" style="margin-left: 8px;">
                ${hasDifference ? 'Diff Marked' : 'Identical'}
              </span>
            </div>
            <div style="display: flex; gap: 8px;">
              <button onclick="playCue('${cue.start}', '${cue.end}', ${cue.id})">▶ Play Segment</button>
              <button onclick="takeOriginal(${cue.id})">✓ Take Line</button>
            </div>
          </div>
          <div class="cue-body">
            <div class="column-box">
              <span class="col-title">Original Manuscript Line (Reference)</span>
              <div class="original-text-content">${escapeHtml(cue.matchedOriginal || '(No exact matching text detected)')}</div>
            </div>
            <div class="column-box">
              <span class="col-title">VTT Word Comparison (Differences Marked)</span>
              <div class="diff-display">${diffHtml || '<em>Empty</em>'}</div>
              <textarea class="cue-editor-input" rows="2" oninput="updateCueText(${cue.id}, this.value)">${escapeHtml(cue.text)}</textarea>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('totalCues').innerText = cues.length;
      document.getElementById('diffCues').innerText = diffCueCount;
      const acc = totalWords > 0 ? ((matchedWords / totalWords) * 100).toFixed(1) : 100;
      document.getElementById('accPct').innerText = `${acc}%`;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeQuote(str) {
      return (str || '').replace(/'/g, "\\'");
    }

    window.fixWord = function(cueId, fromWord, toWord) {
      const cue = cues.find(c => c.id === cueId);
      if (!cue) return;
      const regex = new RegExp(`\\b${fromWord}\\b`, 'i');
      cue.text = cue.text.replace(regex, toWord);
      renderCues();
    };

    window.takeOriginal = function(cueId) {
      const cue = cues.find(c => c.id === cueId);
      if (!cue || !cue.matchedOriginal) return;
      cue.text = cue.matchedOriginal;
      renderCues();
    };

    window.updateCueText = function(cueId, val) {
      const cue = cues.find(c => c.id === cueId);
      if (!cue) return;
      cue.text = val;
      // Recompute without losing focus
      const { diffTokens, hasDifference } = computeWordDiff(cue.matchedOriginal, cue.text);
      const card = document.getElementById(`cue-${cueId}`);
      if (card) {
        card.className = `cue-card ${hasDifference ? 'has-diff' : 'perfect'}`;
        const badge = card.querySelector('.badge');
        if (badge) {
          badge.className = `badge ${hasDifference ? 'badge-diff' : 'badge-ok'}`;
          badge.innerText = hasDifference ? 'Diff Marked' : 'Identical';
        }
      }
    };

    let playTimeout = null;
    window.playCue = function(startTs, endTs, cueId) {
      const audio = document.getElementById('mainAudio');
      if (!audio.src) {
        alert('Please attach an audio file using the "Attach Audio" button above to play.');
        return;
      }
      const s = timestampToSec(startTs);
      const e = timestampToSec(endTs);

      document.querySelectorAll('.cue-card').forEach(c => c.classList.remove('active-playback'));
      const activeCard = document.getElementById(`cue-${cueId}`);
      if (activeCard) activeCard.classList.add('active-playback');

      if (playTimeout) clearTimeout(playTimeout);

      audio.currentTime = s;
      audio.play();

      const durationMs = Math.max(200, (e - s) * 1000);
      playTimeout = setTimeout(() => {
        audio.pause();
        if (activeCard) activeCard.classList.remove('active-playback');
      }, durationMs);
    };

    // File Handlers
    document.getElementById('originalFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        originalText = evt.target.result;
        alignCuesToOriginal(cues, originalText);
        renderCues();
      };
      reader.readAsText(file);
    });

    document.getElementById('vttFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        vttRaw = evt.target.result;
        cues = parseVTT(vttRaw);
        alignCuesToOriginal(cues, originalText);
        renderCues();
      };
      reader.readAsText(file);
    });

    document.getElementById('audioFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);
      audioBlobUrl = URL.createObjectURL(file);
      document.getElementById('mainAudio').src = audioBlobUrl;
    });

    document.getElementById('exportVttBtn').addEventListener('click', function() {
      let output = "WEBVTT\n\n";
      cues.forEach(cue => {
        output += `${cue.start} --> ${cue.end}\n${cue.text.trim()}\n\n`;
      });
      const blob = new Blob([output], { type: 'text/vtt;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "corrected_transcript.vtt";
      a.click();
      URL.revokeObjectURL(url);
    });

    // Initial load
    cues = parseVTT(vttRaw);
    alignCuesToOriginal(cues, originalText);
    renderCues();
  </script>
</body>
</html>
